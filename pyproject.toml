[project]
name = "whoodeo"
version = "0.1.0"
description = "Prepare degraded training variants for Whoodeo"
requires-python = ">=3.14"
dependencies = [
    "av>=19.0.2",
]

[project.scripts]
whoodeo-make-low = "whoodeo.make_low:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whoodeo"]
