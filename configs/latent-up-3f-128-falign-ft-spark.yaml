# Fine-tune branch of the feature-align run train-20261124-100406 (which
# keeps running on spark-03), trained on spark-04 from 24.11.2026. Same model, data filter, and recipe as
# latent-up-3f-128-falign-spark.yaml (seed 42, x264-crf18..24 and
# mpeg4-q04/q06 without q08, scene_cut 0.1, codec_unknown 0.2, ema 0.999,
# faces, plateau), with one change: the latent L1 weight 1.0 -> 0.25, so the
# image terms (oklab, ms_ssim, vgg) carry more of the loss.
#
#   whoodeo-train configs/latent-up-3f-128-falign-ft-spark.yaml \
#     --model /mnt/home-storinator-trem/whoodeo/runs/train-20261124-100406/checkpoints/<step>
#
# As in the earlier fine-tune train-20261123-200237: --model loads model.pt
# (the EMA average, SPyNet included); the average restarts from those
# weights, a new optimizer and a fresh plateau, the step counter at 0, a new
# run directory. The data are rescanned at start from catalog.json, so the
# low variants make_low has finished since the first run are in; make_low
# writes *.partial.mkv and only lists a file when it is complete.
# The main run on spark-03 stays runs/latest; this branch does not publish.
publish_latest: false

model:
  arch: latent_up
  vae: /mnt/home-storinator-trem/whoodeo/runs/train-20261119-180935/checkpoints/044750
  latent: 16
  channels: 128             # low resolution; 256 at 1/2, 512 at 1/4
  widths: [1, 2, 4]
  encoder_blocks: [2, 4]    # residual blocks at low (per frame, before the alignment) and at 1/2
  blocks: 12
  activation: relu
  condition: codec
  in_frames: 3              # previous, middle, next; feature alignment inside the model

variants: "^(x264-crf(18|20|22|24)|mpeg4-q0[46])/"

codec_unknown: 0.2
scene_cut: 0.1
ema: 0.999
init_from_vae: false

batch: 8
lr: 1.0e-4
schedule:
  kind: plateau
  patience: 8
  factor: 0.5
  min_delta: 0.01
  min_lr: 1.0e-6
holdout: 0.1
val_every: 500
val_count: 96
seed: 42
loss:
  terms:
    - name: latent
      weight: 0.25         # was 1.0 in latent-up-3f-128-falign-spark.yaml
    - name: oklab
      weight: 4.5
      channels: [1.0, 1.0, 1.0]
    - name: ms_ssim
      weight: 1.0
      scales: 5
    - name: vgg
      layers:
        relu2_2: 0.230
        relu3_4: 0.155

faces:
  weight: 3.0
  score: 0.6
  expand: 1.2
  feather: 0.1
