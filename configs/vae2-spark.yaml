# vae2 on the DGX Spark: the same recipe as vae2.yaml with batch 8. Resume a Mac run with it.
# The decoder is only convolutions, SiLU, additions, and nearest doubling,
# so it converts for the Neural Engine. Fine-tune it with configs/vae2-gan.yaml.

model:
  arch: vae2
  blocks: 6          # dilated residual blocks at the latent, in encoder and decoder
  channels: 64       # full resolution; 128 at 1/2, 256 from 1/4 down
  latent: 8
  factor: 8
  beta: 1.0e-4       # KL is ~1% of the objective at sigma 0.05; 0.02 dominated it

batch: 8          # Spark: 8 fills ~95 of 121 GB, 12 swaps and is slower per frame
lr: 1.0e-4
schedule:
  kind: plateau
  patience: 4        # validations, 4 x 250 = 1000 steps
  factor: 0.5
  min_delta: 0.01    # relative improvement over best that counts
  min_lr: 1.0e-6
holdout: 0.1
val_every: 250
val_count: 32
seed: 42
loss:
  balance: start
  terms:
    - name: pixel
      weight: 0.6
      kind: l1
    - name: vgg
      weight: 0.25
      layers: [relu2_2, relu3_4]
    - name: color      # L1 on 1/8 pooled YCbCr, against drift in flat areas
      weight: 0.15
