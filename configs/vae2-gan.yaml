# Fine-tune a vae2 decoder with a GAN. The encoder stays frozen, so the
# latent an upscaler learns on does not move. The model comes from the run:
#   uv run whoodeo-train configs/vae2-gan.yaml --model <run>/latest
# The discriminator trains from the first step. The generator term joins at
# start, weighted by the gradient ratio at the last decoder layer times weight.
# lr stays put: the validation objective leaves the gan out, so a plateau on
# it would read the sharper decoder as a regression.

freeze_encoder: true
batch: 2
lr: 5.0e-5
steps: 20000
holdout: 0.1
val_every: 250
val_count: 32
seed: 42
# The loss is the sum of weight x raw term. The weights are multipliers, not
# shares, and nothing is calibrated. pixel, vgg, and color are those of
# configs/vae2.yaml and configs/vae2d-spark.yaml. mu_l2 and scale_eq are left
# out: the encoder is frozen.
loss:
  terms:
    - name: pixel
      weight: 1.0
      kind: l1
    - name: vgg
      layers:
        relu2_2: 0.230
        relu3_4: 0.155
    - name: color
      weight: 5.5
      space: oklab
      pool: 16
    - name: gan        # not in the sum: multiplies the adaptive weight
      weight: 0.1      # latent diffusion uses 0.5; a gentler start for a fine-tune
      crop: 512
      disc_lr: 1.0e-4
      start: 1000
