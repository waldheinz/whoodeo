# Full-frame 2x training. The first term anchors the loss magnitude.
# balance: start freezes the scales on the validation frames.
# balance: running keeps the weights as shares (EMA 0.99).
# Optional keys, omitted here: steps, out.

model:
  arch: modified
  blocks: 32
  channels: 256
  in_frames: 3

batch: 2
lr: 2.0e-5
holdout: 0.1
log_every: 10
val_every: 500
val_count: 32
seed: 0
loss:
  balance: start
  terms:
    - name: pixel
      weight: 0.60
      kind: l1
    - name: vgg
      weight: 0.20
      layers: [relu2_2, relu3_4]
    - name: gan
      weight: 0.20
      crop: 256
      disc_lr: 1.0e-4
