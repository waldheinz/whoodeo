# Full-frame 2x training. The loss is the sum of weight x raw term.
# Optional keys, omitted here: steps, out, variants.

model:
  arch: modified
  blocks: 16
  channels: 64
  in_frames: 1

batch: 4
lr: 2.0e-4
holdout: 0.1
val_every: 1000
val_count: 32
seed: 0
# The loss is the sum of weight x raw term. With one term, weight 1 is the old loss.
loss:
  terms:
    - name: pixel
      weight: 1.0
      kind: l1
