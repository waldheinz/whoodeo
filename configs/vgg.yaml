# Pixel L1 plus VGG, no discriminator.

model:
  arch: modified
  blocks: 16
  channels: 128
  in_frames: 5

batch: 1
lr: 2.0e-5
holdout: 0.1
val_every: 500
val_count: 32
seed: 0
# Estimate, no checkpoint to derive from: the old balanced pixel 0.5, vgg 0.5 at step 0, with
# the bilinear upscale of the 32 seed-0 val frames as reference (L1 0.0134, VGG
# relu2_2 0.309, relu3_4 0.472). A layer weight is (0.5/0.5) x L1 / (2 x ref).
loss:
  terms:
    - name: pixel
      weight: 1.0
      kind: l1
    - name: vgg
      layers:
        relu2_2: 0.0217
        relu3_4: 0.0142
