# Pixel L1 plus VGG, no discriminator.

model:
  arch: modified
  blocks: 16
  channels: 128
  in_frames: 5

batch: 1
lr: 2.0e-5
holdout: 0.1
log_every: 50
val_every: 500
val_count: 32
seed: 0
loss:
  balance: start
  terms:
    - name: pixel
      weight: 0.5
      kind: l1
    - name: vgg
      weight: 0.5
      layers: [relu2_2, relu3_4]
