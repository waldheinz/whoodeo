# latent-up-3f-128 with feature alignment inside the model, spark-03,
# 24.11.2026. Fresh run from zero (no --model); only SPyNet starts from the
# official BasicVSR weights and stays frozen.
#
#   whoodeo-train configs/latent-up-3f-128-falign-spark.yaml
#
# Per frame: encoder stem and the 2 blocks at low resolution (128 channels,
# with FiLM). SPyNet computes the flow middle -> previous and middle -> next
# on the low frames (two runs), the neighbor features are warped along it,
# and a fusion (3x3 conv over middle, both warped neighbors and one
# warp-error channel per neighbor, activation, 3x3 conv) is added onto the
# middle features. From the stride-2 convolution on, one stream: 4 blocks at
# 1/2, 12 at 1/4, the head, FiLM as before, frozen vae2 decoder. See
# src/whoodeo/models/latent_up.py.
#
# Same recipe as the pixel-align run train-20261123-155857 on spark-04
# (configs of e0df88a: latent-up-3f-128-align-spark.yaml): vae2 044750,
# width 128, plateau, loss, faces, FiLM, codec_unknown 0.2, scene_cut 0.1,
# ema 0.999, batch 8, seed 42. scene_cut swaps neighbors on the raw low
# frames before the model's alignment.
#
# Data: x264-crf18/20/22/24 and mpeg4-q04/q06. Unlike the align run,
# mpeg4-q08 (the worst mpeg4) is left out, in training and validation.
# make_low writes into *.partial.mkv and only renames the file when it is
# complete, so in-progress transcodes are not read.

model:
  arch: latent_up
  vae: /mnt/home-storinator-trem/whoodeo/runs/train-20261119-180935/checkpoints/044750
  latent: 16
  channels: 128             # low resolution; 256 at 1/2, 512 at 1/4
  widths: [1, 2, 4]
  encoder_blocks: [2, 4]    # residual blocks at low (per frame, before the alignment) and at 1/2
  blocks: 12
  activation: relu
  condition: codec
  in_frames: 3              # previous, middle, next; feature alignment inside the model

variants: "^(x264-crf(18|20|22|24)|mpeg4-q0[46])/"

# Official SPyNet weights (also inside FTVSR_REDS.pth), loaded once at the
# start of a fresh run; afterwards they are part of the checkpoint. Frozen.
spynet_weights: /home/trem/ftvsr/weights/spynet_20210409-c6c1bd09.pth

codec_unknown: 0.2
scene_cut: 0.1
ema: 0.999
init_from_vae: false

batch: 8
lr: 1.0e-4
schedule:
  kind: plateau
  patience: 8
  factor: 0.5
  min_delta: 0.01
  min_lr: 1.0e-6
holdout: 0.1
val_every: 500
val_count: 96
seed: 42
loss:
  terms:
    - name: latent
      weight: 1.0
    - name: oklab
      weight: 4.5
      channels: [1.0, 1.0, 1.0]
    - name: ms_ssim
      weight: 1.0
      scales: 5
    - name: vgg
      layers:
        relu2_2: 0.230
        relu3_4: 0.155

faces:
  weight: 3.0
  score: 0.6
  expand: 1.2
  feather: 0.1
