# Pixel MSE only, on a small network.

model:
  arch: modified
  blocks: 8
  channels: 64
  in_frames: 5

batch: 1
lr: 2.0e-5
holdout: 0.1
val_every: 500
val_count: 32
seed: 0
# The loss is the sum of weight x raw term. With one term, weight 1 is the old loss.
loss:
  terms:
    - name: pixel
      weight: 1.0
      kind: mse
