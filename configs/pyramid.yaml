# Coarse correlation, then a small correction at the finer scales. The
# correction starts at zero, so an untrained model is the bilinear enlargement
# of the middle frame. Pixel L1 holds the level, VGG pulls the edges. No GAN:
# two films are not enough for a discriminator.

model:
  arch: pyramid
  blocks: 16
  channels: 128
  in_frames: 3
  levels: 3
  stem: 2
  radius: 4

batch: 2
lr: 1.0e-4
holdout: 0.1
val_every: 500
val_count: 16
seed: 0
# Estimate, no checkpoint to derive from: the old balanced pixel 0.7, vgg 0.3 at step 0, with
# the bilinear upscale of the 32 seed-0 val frames as reference (L1 0.0134, VGG
# relu2_2 0.309, relu3_4 0.472). A layer weight is (0.3/0.7) x L1 / (2 x ref).
loss:
  terms:
    - name: pixel
      weight: 1.0
      kind: l1
    - name: vgg
      layers:
        relu2_2: 0.00929
        relu3_4: 0.00609
