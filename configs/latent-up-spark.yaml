# latent-up on the DGX Spark: a first trial of a 2x upscaler that predicts the
# code of the frozen vae2d (runs/train-20261020-093437, step 15755) instead of
# pixels. The low frame h x w goes to the normalized code
# z = (mu - shift) * scale at h/4 x w/4, which is the vae2 latent of the
# 2h x 2w master; the frozen decoder turns z / scale + shift into the picture.
# Whole frames, every low variant of the catalog (no variants filter).

model:
  arch: latent_up
  vae: /mnt/home-storinator-trem/whoodeo/runs/train-20261020-093437/checkpoints/015755
  latent: 16                # the vae2d's channels
  channels: 64              # low resolution; 128 at 1/2, 256 at 1/4
  widths: [1, 2, 4]         # multiples of channels: low, 1/2, 1/4
  encoder_blocks: [2, 4]    # residual blocks at low and at 1/2
  blocks: 12                # residual blocks at 1/4, dilations 1, 2, 4 in turn
  # relu instead of silu, for the Neural Engine (see vae2e-spark.yaml). The
  # step-2669 run (runs/train-20261021-064120) is silu and does not resume
  # under this. vae: above still names the silu vae2d; it moves to the vae2e
  # run once that is trained.
  activation: relu

# Copy the vae2d's 6 latent blocks into the last 6 blocks at 1/4 and its head
# (shift and scale folded in). Fresh runs only.
init_from_vae: false

batch: 8          # tested 21.10.2026: fits with >10 GB available
                  # (batch 6 was 3.8 s/step at 720p, 1.7 s at 480p)
lr: 1.0e-4
schedule:
  kind: plateau
  patience: 8
  factor: 0.5
  min_delta: 0.01
  min_lr: 1.0e-6
holdout: 0.1
val_every: 250
val_count: 96
seed: 42
# The loss is the sum of weight x raw. latent, L1 on the normalized code, is
# the main term. The image terms are the vae2d recipe (pixel 1, vgg 0.230 /
# 0.155, oklab color 5.5 on 1/16) times 0.75, so their balance is the one
# that decoder was trained under. Measured on a 200-step trial with the full
# vae2d weights (96 val frames): at step 0 the image part was 0.60 against
# latent 0.74 (an untrained decode), at step 100 0.26 against 0.59, at step
# 200 0.22 against 0.52, about 42%, vgg 0.15 of it and barely moving. Times
# 0.75 is about 1/3 of the latent term over the first few hundred steps.
# vgg has a floor at the vae2d roundtrip, so as the latent L1 falls the
# image part will gain share; lower these if it starts to dominate.
loss:
  terms:
    - name: latent       # L1 on the normalized code against the vae2d code of the master
      weight: 1.0
    - name: pixel
      weight: 0.75
      kind: l1
    - name: vgg
      layers:
        relu2_2: 0.1725
        relu3_4: 0.11625
    - name: color      # L1 on 1/16 pooled Oklab, a and b weighted twice
      weight: 4.125
      space: oklab
      pool: 16
