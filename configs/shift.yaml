# Search stays as in the README: radius 4, three frames, fixed sharpness.
# The trunk is wide enough for texture. Pixel L1 holds structure, VGG the
# mid frequencies, a small GAN the last crispness.

model:
  arch: shift
  blocks: 16
  channels: 128
  in_frames: 3
  radius: 4
  stem: 2
  sharpness: 10
  reject: true

batch: 2
lr: 5.0e-5
holdout: 0.1
val_every: 500
val_count: 16
seed: 0
# Estimate, no checkpoint to derive from: the old balanced pixel 0.6, vgg 0.3, gan 0.1 (it ran balance running) at step 0, with
# the bilinear upscale of the 32 seed-0 val frames as reference (L1 0.0134, VGG
# relu2_2 0.309, relu3_4 0.472). A layer weight is (0.3/0.6) x L1 / (2 x ref).
# gan is (0.1/0.6) x L1 / ln 2, the BCE of an untrained discriminator.
loss:
  terms:
    - name: pixel
      weight: 1.0
      kind: l1
    - name: vgg
      layers:
        relu2_2: 0.0108
        relu3_4: 0.00711
    - name: gan
      weight: 0.00322
      crop: 256
      disc_lr: 1.0e-4
