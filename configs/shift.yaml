# Search stays as in the README: radius 4, three frames, fixed sharpness.
# The trunk is wide enough for texture. Pixel L1 holds structure, VGG the
# mid frequencies, a small GAN the last crispness. balance running keeps
# those weights as shares, so a stronger discriminator cannot take over.

model:
  arch: shift
  blocks: 16
  channels: 128
  in_frames: 3
  radius: 4
  stem: 2
  sharpness: 10
  reject: true

batch: 2
lr: 5.0e-5
holdout: 0.1
log_every: 10
val_every: 500
val_count: 16
seed: 0
loss:
  balance: running
  terms:
    - name: pixel
      weight: 0.60
      kind: l1
    - name: vgg
      weight: 0.30
      layers: [relu2_2, relu3_4]
    - name: gan
      weight: 0.10
      crop: 256
      disc_lr: 1.0e-4
